<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportar incidencia - SiGeRU</title>

    <link rel="stylesheet" href="../CSS/estilo.css">
</head>
<body data-roles="1">

    <header>
    <nav class="navbar">
        <h1>SiGeRU</h1>

        <div class="nav-links">
            <ul>
                    <li><a href="panelVecino.html">Volver al panel</a></li>                
            </ul>
        </div>
    </nav>
</header>

    <!-- Formulario para reportar una nueva incidencia en el sistema -->
    <main class="form-main">
        <section class="form-card">

            <h2>Reportar nueva incidencia</h2>
            <p>Complete todos los datos del problema encontrado.</p>
            
            <!-- Creación de campos para reportar incidencia-->
            <form id="incidenciaForm">

                <label for="tipo">Tipo de incidencia</label>
                <select name="tipo" id="tipo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="rotura">Rotura</option>
                    <option value="desborde">Desborde</option>
                    <option value="falta_recoleccion">Falta de recolección</option>
                    <option value="otro">Otro</option>
                </select>

                <label for="id_contenedor">Calle</label>
                <select name="id_contenedor" id="id_contenedor" required>
                    <option value="">Seleccione una calle</option>
                    
                    <!-- Después se carga con JavaScript -->

                </select>

                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" rows="6" placeholder="Describa brevemente el problema" required></textarea>

                <p id="mensaje"></p>

                <!-- Botones de acción: Guardar y cancelar -->
                   <div class="botones-opciones">
                <button type="submit" class="btn-enviar">Enviar reporte</button>

                <a href="panelVecino.html" class="btn-cancelar">Cancelar</a>
            </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© Naraka BFL</p>
    </footer>

    <script src="../JS/auth.js"></script>
    <script src="../JS/reportarIncidencia.js"></script>
    
</body>
</html>
