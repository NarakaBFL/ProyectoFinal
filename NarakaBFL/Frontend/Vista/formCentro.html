<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SiGeRU - Alta / Edición de Centro de Acopio</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
</header>

<main>
    <h2 id="tituloForm">Nuevo Centro de Acopio</h2>

    <form id="formCentro">
        <input type="hidden" id="id_centro">

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" required>

        <label for="ubicacion">Ubicación</label>
        <input type="text" id="ubicacion" required>

        <label for="tipo_residuo">Tipo de residuo gestionado</label>
        <select id="tipo_residuo" required>
            <option value="">Seleccionar...</option>
            <option value="General">General</option>
            <option value="Reciclable">Reciclable</option>
            <option value="Orgánico">Orgánico</option>
        </select>

        <label for="capacidad_total">Capacidad total (kg)</label>
        <input type="number" id="capacidad_total" min="1" step="0.01" required>

        <!-- Solo visible al editar: RF-19.2 -->
        <div id="grupoOcupacion" style="display:none;">
            <label for="ocupacion_actual">Ocupación actual (kg)</label>
            <input type="number" id="ocupacion_actual" min="0" step="0.01">
        </div>

        <div class="acciones">
            <button type="submit" class="btn-primario">Guardar</button>
            <a href="centros.html" class="btn-secundario">Cancelar</a>
        </div>

        <p id="mensajeError" class="error" style="display:none;"></p>
    </form>
</main>

<script src="js/centros.js"></script>

<script src="../JS/navbar.js" defer></script>
</body>
</html>
