<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario incidencia admin - Naraka BFL</title>
    <link rel="stylesheet" href="../CSS/estilo.css">
</head>
<body>

    <header>
</header>

    <!-- Formulario para reportar una nueva incidencia en el sistema -->
    <main class="form-main">
        <section class="form-card">

            <h2>Reportar nueva incidencia</h2>
            <p>Complete todos los campos para reportar una nueva incidencia en el sistema.</p>
            
            <!-- Creación de campos para reportar incidencia -->
            <form>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" placeholder="Fecha del reporte" required>

                <label for="tipo">Tipo de incidencia</label>
                <select name="tipo" id="tipo" required>
                    <option value="">Seleccione una opción</option>
                    <option value="rotura">Rotura</option>
                    <option value="desborde">Desborde</option>
                    <option value="falta-recolección">Falta de recolección</option>
                    <option value="problema-camion">Problema con camión</option>
                    <option value="otro">otro</option>
                </select>

                <label for="desc">Descripción:</label>
                <textarea id="desc" name="desc" rows="6" required></textarea>

                <label for="contenedor">Contenedor involucrado</label>
                <select name="contenedor" id="contenedor" required>
                    <option value="">Seleccione un contenedor</option>
                    <option value="">No corresponde</option>
                    <option value="1">Contenedor C-001</option>
                    <option value="2">Contenedor C-002</option>
                </select>

                <label for="camion">Camión involucrado</label>
                <select name="camion" id="camion" required>
                    <option value="">Seleccione un camión</option>
                    <option value="">No corresponde</option>
                    <option value="1">Contenedor CAM-001</option>
                    <option value="2">Contenedor CAM-002</option>
                </select>

                <label for="estado">Estado</label>
                <select name="camion" id="camion" required>
                    <option value="abierta">Abierta</option>
                    <option value="en-curso">En curso</option>
                    <option value="resuelta">Resuelta</option>
                </select>

                <!-- Botones de acción: Guardar y cancelar -->
                   <div class="botones-opciones">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="camiones.html" class="btn-cancelar">Cancelar</a>
            </div>
            </form>
        </section>
    </main>

    <footer>
        <p>© Naraka BFL</p>
    </footer>
    
    <script src="../JS/navbar.js" defer></script>
</body>
</html>
