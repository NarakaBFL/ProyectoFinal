<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Naraka BFL</title>
    <link rel="stylesheet" href="../CSS/estilo.css">
</head>

<!-- Listado de incidencias reportadas en el sistema -->
<body data-roles="2">
    <header id="navbar">
    </header>

    <main class="gestion-main">
        <h2>Registro de incidencias</h2>
        <p>
            Listado de incidencias reportadas en el sistema.
        </p>

        <!-- Botón para agregar un nuevo registro de incidencia -->
        <div class="acciones">
            <a href="formIncidenciaAdmin.html" class="btn-nuevo">+ Nueva incidencia</a>
        </div>

        <div class="tabla-form">

            <!-- Tabla con datos de ejemplo -->
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Tipo de incidencia</th>
                    <th>Descripción</th>
                    <th>Contenedor</th>
                    <th>Usuario</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody id="tablaIncidencias">
                    <!-- Las incidencias vendrán desde JS-->
                </tbody>

            </table>

        </div>
    </main>

    <footer>
    <p>© Naraka BFL - SiGeRU</p>

    <div class="footer-links">
        <a href="panelAdmin.html" style="text-decoration: none;">Panel</a>
        <a href="inicio.html" style="text-decoration: none;">Inicio</a>
    </div>
    </footer>

    <script src="../JS/navbar.js?v=2" defer></script>
    <script src="../JS/auth.js" defer></script>
    <script src="../JS/incidencias.js" defer></script>
</body>
</html>
