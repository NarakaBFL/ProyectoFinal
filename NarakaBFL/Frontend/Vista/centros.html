<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SiGeRU - Centros de Acopio y Vertederos</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
    <h1>SiGeRU</h1>
    <nav>
        <a href="panel.html">Panel</a>
        <a href="usuarios.html">Usuarios</a>
        <a href="contenedores.html">Contenedores</a>
        <a href="camiones.html">Camiones</a>
        <a href="centros.html" class="activo">Centros de Acopio</a>
    </nav>
</header>

<main>
    <h2>Centros de Acopio y Vertederos</h2>

    <div class="acciones">
        <a href="formCentro.html" class="btn-primario">+ Nuevo Centro</a>
    </div>

    <!-- Filtros: RF-18.4 -->
    <form id="filtros" class="filtros">
        <input type="text" id="f_ubicacion" placeholder="Filtrar por ubicación...">
        <select id="f_tipo_residuo">
            <option value="">Todos los tipos</option>
            <option value="General">General</option>
            <option value="Reciclable">Reciclable</option>
            <option value="Orgánico">Orgánico</option>
        </select>
        <select id="f_estado">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>
        <button type="submit">Filtrar</button>
    </form>

    <table id="tablaCentros">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Tipo de residuo</th>
                <th>Capacidad total</th>
                <th>Ocupación</th>
                <th>% Ocupación</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <!-- Filas generadas dinámicamente por centros.js -->
        </tbody>
    </table>

    <p id="mensajeVacio" style="display:none;">No se encontraron centros de acopio.</p>
</main>

<script src="js/centros.js"></script>
</body>
</html>
